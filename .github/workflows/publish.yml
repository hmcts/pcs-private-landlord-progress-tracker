name: Publish

# Reads the roadmap from Jira, commits the day's snapshot, rebuilds the site and deploys it
# to GitHub Pages. If Jira can't be read, the site is still built from the last snapshot
# (with an "out of date" warning), and the run is marked as failed so someone notices.
# On the schedule and a manual dispatch from master, the qa-report job then updates the QA
# readiness report of each active release and feature in Confluence (README.md, "QA readiness
# report"), on a self-hosted runner that can reach Jenkins. A failure there fails the run too,
# but never stops the site being deployed.
#
# Jira is read through twg, the Atlassian CLI, the same way hmcts/cft-workspace's doc-drift
# workflow reads Confluence. twg has no runner-friendly credential (its OAuth login is
# interactive and per-user), so a sign-in made once by hand is kept in Key Vault, restored
# here (.github/actions/twg-sign-in), refreshed, and written back (.github/actions/twg-store).
# Every refresh rotates the refresh token and spends the old one, so the new value is stored
# straight after refreshing, and again at the end of the job if twg refreshed itself mid-run.
# build and qa-report each have their own sign-in (their own Key Vault secret), so they never
# spend each other's refresh token, and each job has its own concurrency group, so two runs of
# one job never overlap. Setup and re-seeding: README.md, "Jira sign-in".
#
# This repo is public: nothing here may print the twg sign-in or any value in it.

on:
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 UTC, Monday to Friday
  workflow_dispatch:
  push:
    branches: [master]

permissions: {}

env:
  TWG_VERSION: '1.4.4'
  TWG_VAULT: ${{ vars.TWG_KEY_VAULT }}
  TWG_SECRET: ${{ vars.TWG_SECRET_NAME || 'twg-auth-conf-pcs-progress-tracker' }}
  QA_TWG_SECRET: ${{ vars.QA_TWG_SECRET_NAME || 'twg-auth-conf-pcs-progress-tracker-qa' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # One build at a time, so two never spend the same refresh token or push snapshots at once.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # commit the daily snapshot
      id-token: write # azure/login over OIDC
    outputs:
      fetch: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # The app registration's federated credential covers refs/heads/master only, so a
      # dispatch from another branch can't reach the vault and builds from the last snapshot.
      - name: Sign in to Azure for the twg sign-in
        id: azure-login
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.TWG_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign in to twg
        id: twg
        uses: ./.github/actions/twg-sign-in
        with:
          version: ${{ env.TWG_VERSION }}
          vault: ${{ env.TWG_VAULT }}
          secret: ${{ env.TWG_SECRET }}
          azure-login: ${{ steps.azure-login.outcome }}

      - name: Read the roadmap from Jira
        id: fetch
        if: steps.twg.outputs.signed_in == 'true'
        continue-on-error: true
        run: npm run fetch

      - name: Store the twg sign-in if it rotated again
        if: always() && steps.twg.outputs.restored == 'true'
        uses: ./.github/actions/twg-store
        with:
          vault: ${{ env.TWG_VAULT }}
          secret: ${{ env.TWG_SECRET }}

      - name: Sign out of Azure and twg
        if: always()
        run: |
          az logout > /dev/null 2>&1 || true
          rm -rf "${HOME:?}/.azure" "${HOME:?}/.config/twg" "${XDG_CONFIG_HOME:-${HOME:?}/.config}/twg"

      - name: Commit the snapshot
        if: steps.fetch.outcome == 'success'
        run: |
          git add data/snapshots
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Roadmap snapshot $(date -u +%F)"
          git pull --rebase --quiet && git push

      - name: Build the site
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write # deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  jira:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: needs.build.outputs.fetch != 'success'
        run: |
          echo "::error::Couldn't read the roadmap from Jira, so the site was built from the last snapshot. The build job's log says why."
          exit 1

  # Updates the QA readiness report of each active release and feature, on HMCTS's self-hosted
  # azure-nonprod runners, which can reach Jenkins (build.hmcts.net) where GitHub's can't. This
  # repo is public, so a self-hosted runner must never run code from a pull request: the job
  # runs only for the schedule and a manual dispatch from master, and this workflow has no
  # pull_request trigger (ci.yml, which has, stays on GitHub's runners). It has its own twg
  # sign-in and its own concurrency group, and nothing needs it, so it never waits for, delays or
  # stops the site; a failure here fails the run instead. timeout-minutes counts only once a
  # runner has picked the job up. Until then it waits in the queue (GitHub cancels a job queued
  # for 24 hours), holding back only the next qa-report.
  qa-report:
    concurrency:
      group: qa-report
      cancel-in-progress: false
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: azure-nonprod
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # azure/login over OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sign-in steps need these. Nothing is installed on a shared runner: one that lacks
      # them is the wrong runner, and the job says which are missing.
      - name: Check the runner's tools
        run: |
          set -euo pipefail
          missing=()
          for tool in az jq curl sha256sum tar gzip base64; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            echo "::error::the runner lacks ${missing[*]}, which the twg and Key Vault steps need"
            exit 1
          fi

      # The runner is shared and may outlive the job, so the Azure and twg sign-ins live in
      # directories of this job's own, never in the runner's home. AZURE_CONFIG_DIR is set for
      # every later step, azure/login included; twg's HOME is given to each step that runs it.
      - name: Keep this job's sign-ins to itself
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP:?}/azure" "${RUNNER_TEMP:?}/twg-home"
          chmod 700 "${RUNNER_TEMP:?}/azure" "${RUNNER_TEMP:?}/twg-home"
          echo "AZURE_CONFIG_DIR=${RUNNER_TEMP:?}/azure" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Sign in to Azure for the twg sign-in
        id: azure-login
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.TWG_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign in to twg
        id: twg
        uses: ./.github/actions/twg-sign-in
        with:
          version: ${{ env.TWG_VERSION }}
          vault: ${{ env.TWG_VAULT }}
          secret: ${{ env.QA_TWG_SECRET }}
          azure-login: ${{ steps.azure-login.outcome }}
          home: ${{ runner.temp }}/twg-home

      # Judged as the report's own Jenkins reader judges it, with the same credentials, so the
      # first run on this runner group shows whether the E2E rows can be read: reachable, a sign-in
      # redirect, unauthorised or unreachable. Only that is printed. The report runs either way;
      # rows it can't read keep their published answer.
      - name: Check Jenkins can be reached
        env:
          JENKINS_USERNAME: ${{ vars.JENKINS_USER }}
          JENKINS_PASSWORD: ${{ secrets.JENKINS_TOKEN }}
        run: node --no-warnings scripts/qa-jenkins-check.ts

      # Edits are made as whoever seeded the QA twg secret, and Jenkins is read as the owner of the
      # JENKINS_TOKEN API token. Cosmos is read only with the read-only key in the
      # COSMOS_PIPELINE_METRICS_KEY secret: the Azure sign-in has no Cosmos role, so without the
      # key the Cosmos rows are unknown and keep their published answer. Evidence stays in
      # $RUNNER_TEMP, and the log gets only counts.
      - name: Update the QA readiness reports
        id: qa
        if: steps.twg.outputs.signed_in == 'true'
        timeout-minutes: 20
        env:
          QA_CACHE_DIR: ${{ runner.temp }}/qa
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COSMOS_PIPELINE_METRICS_KEY: ${{ secrets.COSMOS_PIPELINE_METRICS_KEY }}
          JENKINS_USERNAME: ${{ vars.JENKINS_USER }}
          JENKINS_PASSWORD: ${{ secrets.JENKINS_TOKEN }}
          HOME: ${{ runner.temp }}/twg-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/twg-home/.config
        run: npm run qa-report -- --all-active --publish

      # Fails the job so it's seen; it never affects the site. An unseeded secret stands down in
      # the sign-in step without spending anything.
      - name: Fail if twg could not sign in
        if: steps.twg.outputs.signed_in != 'true'
        env:
          RESTORED: ${{ steps.twg.outputs.restored }}
        run: |
          if [[ "$RESTORED" != "true" ]]; then
            echo "::notice::the QA job's twg sign-in ($QA_TWG_SECRET) could not be restored, so nothing was spent. If it has never been seeded, seed it as in README.md, \"Jira sign-in\""
          fi
          echo "::error::twg isn't signed in, so the QA readiness reports weren't updated. The sign-in step says why."
          exit 1

      - name: Store the twg sign-in if it rotated again
        if: always() && steps.twg.outputs.restored == 'true'
        uses: ./.github/actions/twg-store
        with:
          vault: ${{ env.TWG_VAULT }}
          secret: ${{ env.QA_TWG_SECRET }}
          home: ${{ runner.temp }}/twg-home

      # A self-hosted runner can outlive the job, so neither sign-in, twg nor the evidence is left
      # on it. Only this job's own directories are removed: the runner's home is never touched.
      - name: Remove this job's sign-ins and evidence
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/azure" "${RUNNER_TEMP:?}/twg-home" "${RUNNER_TEMP:?}/qa" "${RUNNER_TEMP:?}/bin"
