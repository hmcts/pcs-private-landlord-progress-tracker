# Non-functional requirements (NFRs) and the standards they come from. Edit through a PR.
# This site is public: summarise each requirement in plain English and link to the source for
# the full wording. Leave out anything a source still marks as to be confirmed.
#
# standards:
#   - id: pcs-nfrs             # referred to by an NFR's "source"
#     title: Name of the standard or page
#     url: https://...
#     note: Optional, for example "Draft"
#
# nfrs:
#   - id: PERF-01              # category prefix then a number (see NFR_CATEGORIES in scripts/lib/data.ts)
#     category: performance    # performance | accessibility | security | reliability | data | support | quality | engineering
#     requirement: What must be true
#     target: Optional measurable target
#     ref: PER-05              # optional, the requirement's ID in the source
#     source: pcs-performance  # a standards id
#     url: https://...         # optional, a more specific page than the standard's url

standards:
  - id: pcs-performance
    title: PCS performance SLA and NFRs
    url: https://hmcts.atlassian.net/wiki/spaces/RRFM/pages/272433544
  - id: pcs-story-nfrs
    title: PCS standard NFR acceptance criteria for stories
    url: https://hmcts.atlassian.net/wiki/spaces/RRFM/pages/367755875
    note: Draft
  - id: hmcts-qa
    title: HMCTS Quality Assurance standards
    url: https://hmcts.atlassian.net/wiki/pages/viewpage.action?pageId=268043682
  - id: hmcts-security
    title: HMCTS baseline security requirements for applications (F6f)
    url: https://hmcts.atlassian.net/wiki/spaces/DACS/pages/279758773
  - id: hmcts-way
    title: HMCTS engineering standards (The HMCTS Way)
    url: https://hmcts.github.io/standards/

nfrs:
  - id: PERF-01
    category: performance
    requirement: Screens respond quickly at peak load.
    target: 90% within 500ms, 95% within 1 second, 99% within 2 seconds
    ref: PER-05
    source: pcs-performance
  - id: PERF-02
    category: performance
    requirement: APIs respond quickly at peak load.
    target: 90% within 350ms, 95% within 500ms
    ref: PER-06
    source: pcs-performance
  - id: PERF-03
    category: performance
    requirement: Pages load quickly.
    target: Within 2 seconds
    source: pcs-performance
  - id: PERF-04
    category: performance
    requirement: Documents upload and download quickly.
    target: A 5MB file within 10 seconds
    source: pcs-performance
  - id: PERF-05
    category: performance
    requirement: Very few requests fail under load.
    target: Fewer than 1% of requests
    source: pcs-performance
  - id: PERF-06
    category: performance
    requirement: Servers keep spare capacity under load.
    target: CPU and memory use at or below 75%
    source: pcs-performance
  - id: PERF-07
    category: performance
    requirement: The service is tested at peak load, not only normal load.
    target: 3 times the normal hourly volume for each user journey
    source: pcs-performance
  - id: PERF-09
    category: performance
    requirement: Welsh journeys meet the same performance targets as English ones.
    source: pcs-performance
  - id: PERF-11
    category: performance
    requirement: Performance is tested during story development on the path to live, including in Preview, not only before release.
    source: hmcts-qa

  - id: A11Y-06
    category: accessibility
    requirement: Every page is checked with Pa11y, with no outstanding WCAG A or AA failures.
    source: hmcts-qa
  - id: A11Y-07
    category: accessibility
    requirement: The service meets WCAG 2.1 and is tested by hand with NVDA, JAWS and VoiceOver screen readers, with a keyboard only, and on iOS and Android phones and tablets.
    source: hmcts-qa
  - id: A11Y-08
    category: accessibility
    requirement: A Digital Accessibility Centre (DAC) audit is done or booked, especially after major changes, and the accessibility statement is kept up to date.
    source: hmcts-qa
  - id: A11Y-09
    category: accessibility
    requirement: The service is tested across the browsers and devices the GOV.UK service standard requires.
    source: hmcts-qa

  - id: SEC-06
    category: security
    requirement: Uploaded files are checked for type and size and stored through the HMCTS document store.
    ref: FILE-01
    source: pcs-story-nfrs
  - id: SEC-07
    category: security
    requirement: Static and dynamic security scans run nightly, and dependency checks (OWASP, yarn audit) and Helmet are part of the pipeline.
    source: hmcts-qa
  - id: SEC-08
    category: security
    requirement: An IT health check (ITHC) penetration test is completed or booked before release to production, and its findings are tracked.
    source: hmcts-qa
  - id: SEC-09
    category: security
    requirement: Every user has their own account, and legal representatives and other government bodies use multi-factor authentication to reach case data.
    ref: SNFR-AM-01, SNFR-AM-08
    source: hmcts-security
  - id: SEC-10
    category: security
    requirement: 'Passwords follow the HMCTS password standard: accounts lock after repeated failed sign-ins, blank, weak and commonly used passwords are refused, passwords are stored only as salted hashes, and password reset is secure.'
    target: Lock for 60 minutes after 5 failed attempts
    ref: SNFR-AM-02 to SNFR-AM-06, SNFR-AM-09
    source: hmcts-security
  - id: SEC-11
    category: security
    requirement: Error pages, response headers and code comments give away nothing about how the service is built, and Swagger UIs are not hosted alongside the service.
    ref: SNFR-AM-07, SNRF-AS-12, SNRF-AS-17
    source: hmcts-security
  - id: SEC-12
    category: security
    requirement: The service is designed to prevent common attacks such as the OWASP Top 10, and rejects any input that is not in the expected format, range or characters.
    ref: SNRF-AS-01, SNRF-AS-11
    source: hmcts-security
  - id: SEC-13
    category: security
    requirement: Every page and resource checks that the user is allowed to see it, so typing in a URL cannot reach anything they should not.
    ref: SNRF-AS-05
    source: hmcts-security
  - id: SEC-14
    category: security
    requirement: Inactive sessions expire and end fully, cookies are Secure, HttpOnly, not persistent and not cacheable, and pages with passwords or sensitive data are not cached.
    target: 1 hour of inactivity, 15 minutes for admin accounts
    ref: SNRF-AS-04, SNRF-AS-06 to SNRF-AS-10
    source: hmcts-security
  - id: SEC-15
    category: security
    requirement: 'Data is encrypted in transit and at rest to the HMCTS cryptographic standard: HTTP permanently redirects to HTTPS, no insecure protocols or weak ciphers are used, and production certificates match the full domain name, with no wildcards.'
    target: Ciphers of at least 128 bits
    ref: SNRF-AS-02, SNRF-AS-03, SNFR-EN-01 to SNFR-EN-04
    source: hmcts-security
  - id: SEC-16
    category: security
    requirement: All software is current and supported, servers run only the services they need, every component is in HMCTS vulnerability scanning, and security patches are applied in timescales that match the risk.
    ref: SNFR-AS-20, SNFR-SO-01, SNFR-SO-03, SNFR-SO-04
    source: hmcts-security
  - id: SEC-17
    category: security
    requirement: Web applications are protected by a web application firewall (WAF) in prevention mode, and generated tokens avoid the special characters that trigger false WAF alerts.
    ref: SNFR-SO-02, SNFR-AS-19
    source: hmcts-security
  - id: SEC-18
    category: security
    requirement: All inbound and outbound traffic is virus scanned in line.
    ref: SNFR-AV-01
    source: hmcts-security
  - id: SEC-19
    category: security
    requirement: Development, test and production environments are kept separate, and testing happens only in test environments.
    ref: SNRF-AS-16, SNFR-SO-05
    source: hmcts-security

  - id: DAT-06
    category: data
    requirement: Data is stored only in UK Azure data centres.
    ref: SNFR-DM-01
    source: hmcts-security
  - id: DAT-07
    category: data
    requirement: Access to official data is limited to people with a business need, for a set time, third-party access needs a formal agreement, and test data is limited to what the test scenarios need.
    ref: SNFR-DM-02 to SNFR-DM-04
    source: hmcts-security
  - id: DAT-08
    category: data
    requirement: Every change to data is time-stamped against the user who made it, and security events (sign-ins, permission changes, admin actions, data access, deletions and transfers, and lockouts) are logged with the user and time.
    ref: SNRF-AS-13, SNFR-LG-02
    source: hmcts-security
  - id: DAT-09
    category: data
    requirement: Logs hold no sensitive data, are stored securely and separately from the application, are protected from tampering, and are kept in line with the records retention standard.
    ref: SNRF-AS-14, SNRF-AS-15, SNFR-LG-03, SNFR-LG-06
    source: hmcts-security

  - id: SUP-05
    category: support
    requirement: Logs are sent to the HMCTS Security Operations Centre and correlated in its SIEM, which raises alerts, and use of privileged accounts is logged and reviewed by the security team.
    ref: SNFR-LG-01, SNFR-LG-04, SNFR-LG-05
    source: hmcts-security

  - id: QA-06
    category: quality
    requirement: Tests are automated, reliable, fast and repeatable. Most are unit tests, fewer are integration tests, and a small number are end-to-end tests.
    source: hmcts-way
    url: https://hmcts.github.io/standards/principles/test.html
  - id: QA-07
    category: quality
    requirement: Before development starts, the BA, developer and tester meet (a three amigos session) to list the story's test scenarios and agree how it will be built and tested, and the story meets the definition of ready.
    source: hmcts-qa
  - id: QA-08
    category: quality
    requirement: New and refactored code is unit tested. Every test makes an assertion, and tests cover valid, invalid and edge cases.
    target: Over 95% coverage, under 3% duplicated lines in SonarCloud
    source: hmcts-qa
  - id: QA-09
    category: quality
    requirement: Developers' tests are peer reviewed by another developer and by QA, and QA signs off coverage as part of the pull request review.
    source: hmcts-qa
  - id: QA-10
    category: quality
    requirement: Every integration with an external system, and every endpoint, has an integration or functional test, with results published in Jenkins.
    source: hmcts-qa
  - id: QA-11
    category: quality
    requirement: Every integration point with another service has a Pact contract test that is verified, never skipped, and checked with can-i-deploy before release.
    target: Over 90% of integration points
    source: hmcts-qa
  - id: QA-12
    category: quality
    requirement: Smoke tests check for a real response to a GET request, not just a health check.
    source: hmcts-qa
  - id: QA-13
    category: quality
    requirement: Automated UI tests cover only the happy and critical paths, without repeating lower-level tests, and publish their report in Jenkins.
    source: hmcts-qa
  - id: QA-14
    category: quality
    requirement: Tests that cannot be automated are documented in Zephyr and run by hand.
    source: hmcts-qa
  - id: QA-15
    category: quality
    requirement: Every test runs in the pipeline with its report in Jenkins, the Jenkins dashboard is kept green, and defects and requirement traceability are tracked.
    source: hmcts-qa
  - id: QA-16
    category: quality
    requirement: QA joins production defect triage to reproduce the defect in a lower environment, and a test is added with the fix.
    source: hmcts-qa

  - id: ENG-01
    category: engineering
    requirement: Java code follows the HMCTS Java standard.
    source: hmcts-way
    url: https://hmcts.github.io/standards/standards/java.html
  - id: ENG-02
    category: engineering
    requirement: TypeScript code follows the HMCTS TypeScript standard.
    source: hmcts-way
    url: https://hmcts.github.io/standards/standards/typescript.html
  - id: ENG-03
    category: engineering
    requirement: Sign-in and service-to-service calls follow the HMCTS authentication and authorisation standard.
    source: hmcts-way
    url: https://hmcts.github.io/standards/standards/authentication-and-authorization.html
  - id: ENG-04
    category: engineering
    requirement: Frontends follow the HMCTS frontend web performance standard.
    source: hmcts-way
    url: https://hmcts.github.io/standards/standards/frontend-web-performance.html
  - id: ENG-05
    category: engineering
    requirement: APIs follow the HMCTS API practices, including an OpenAPI description.
    source: hmcts-way
    url: https://hmcts.github.io/standards/practices/apis.html
  - id: ENG-06
    category: engineering
    requirement: Build pipelines are deterministic, fail fast, and can be run locally.
    source: hmcts-way
    url: https://hmcts.github.io/standards/principles/pipeline-best-practices.html
  - id: ENG-07
    category: engineering
    requirement: Pipelines use least privilege, no long-lived personal credentials, and pinned dependencies.
    source: hmcts-way
    url: https://hmcts.github.io/standards/practices/ci-cd-security.html
  - id: ENG-08
    category: engineering
    requirement: Code is developed in the open.
    source: hmcts-way
    url: https://hmcts.github.io/standards/principles/coding-in-the-open.html
